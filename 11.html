<!DOCTYPE html>
<html lang="kk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>11-сынып Алгебра: Интерактивті Тест</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.css">
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.css"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/contrib/auto-render.min.js" onload="renderMathInElement(document.body);"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: transparent;
        }
        .glass-card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(229, 231, 235, 0.8);
        }
        .option-btn {
            transition: all 0.2s ease-in-out;
        }
        .option-btn:hover {
            transform: translateY(-2px);
        }
        .fade-in {
            animation: fadeIn 0.3s ease-in-out;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body class="p-2 sm:p-4 min-h-screen flex items-center justify-center">

    <div class="w-full max-w-3xl mx-auto glass-card rounded-2xl shadow-xl overflow-hidden p-4 sm:p-8 my-auto relative">
        
        <!-- Header Section -->
        <header class="border-b pb-4 mb-6 flex flex-col sm:flex-row justify-between items-center gap-4">
            <div>
                <span class="px-3 py-1 bg-indigo-100 text-indigo-700 font-semibold text-xs rounded-full uppercase tracking-wider">11-сынып</span>
                <h1 class="text-2xl font-bold text-gray-800 mt-1">Алгебра және анализ бастамалары</h1>
            </div>
            <div id="progress-container" class="w-full sm:w-auto text-right">
                <span id="question-number" class="text-sm font-semibold text-gray-500">Сұрақ 1 / 10</span>
                <div class="w-full sm:w-32 bg-gray-200 rounded-full h-2.5 mt-1 overflow-hidden">
                    <div id="progress-bar" class="bg-indigo-600 h-2.5 rounded-full transition-all duration-300" style="width: 10%"></div>
                </div>
            </div>
        </header>

        <div id="quiz-screen" class="fade-in">
            <!-- Question Content -->
            <div class="mb-6">
                <h2 id="question-title" class="text-lg sm:text-xl font-semibold text-gray-800 leading-relaxed mb-4">
                    <!-- Question text injected here -->
                </h2>
                
                <!-- Options Grid -->
                <div id="options-container" class="grid grid-cols-1 gap-3">
                    <!-- Options injected dynamically -->
                </div>
            </div>

            <!-- Explanation Box (Initially Hidden) -->
            <div id="explanation-box" class="hidden mb-6 p-4 rounded-xl border transition-all duration-300">
                <div class="flex items-center gap-2 mb-2">
                    <span id="explanation-icon" class="font-bold text-lg"></span>
                    <h4 id="explanation-title" class="font-bold"></h4>
                </div>
                <div id="explanation-text" class="text-sm text-gray-700 space-y-1"></div>
            </div>

            <!-- Footer Controls -->
            <div class="flex justify-between items-center border-t pt-4">
                <button id="prev-btn" onclick="prevQuestion()" class="hidden px-4 py-2 text-sm font-medium text-gray-600 bg-gray-100 rounded-lg hover:bg-gray-200 transition">
                    ← Артқа
                </button>
                <div class="ml-auto flex gap-2">
                    <button id="check-btn" onclick="checkAnswer()" class="px-5 py-2.5 text-sm font-semibold text-white bg-indigo-600 rounded-lg hover:bg-indigo-700 shadow-md transition disabled:opacity-50 disabled:cursor-not-allowed" disabled>
                        Тексеру
                    </button>
                    <button id="next-btn" onclick="nextQuestion()" class="hidden px-5 py-2.5 text-sm font-semibold text-white bg-indigo-600 rounded-lg hover:bg-indigo-700 shadow-md transition">
                        Келесі →
                    </button>
                </div>
            </div>
        </div>

        <div id="result-screen" class="hidden fade-in text-center py-4">
            <div class="w-20 h-20 bg-indigo-100 text-indigo-600 rounded-full flex items-center justify-center mx-auto mb-4 text-3xl font-bold">
                🏆
            </div>
            <h2 class="text-2xl font-bold text-gray-800 mb-2">Тест аяқталды!</h2>
            <p class="text-gray-600 mb-6">Сіздің нәтижеңіз төмендегідей:</p>

            <!-- Score Stats Grid -->
            <div class="grid grid-cols-3 gap-4 mb-8">
                <div class="p-4 bg-gray-50 rounded-xl border border-gray-100">
                    <div class="text-xs text-gray-500 font-medium mb-1">Жалпы балл</div>
                    <div id="final-score" class="text-2xl font-bold text-gray-800">0 / 10</div>
                </div>
                <div class="p-4 bg-gray-50 rounded-xl border border-gray-100">
                    <div class="text-xs text-gray-500 font-medium mb-1">Пайыз</div>
                    <div id="final-percentage" class="text-2xl font-bold text-indigo-600">0%</div>
                </div>
                <div class="p-4 bg-gray-50 rounded-xl border border-gray-100">
                    <div class="text-xs text-gray-500 font-medium mb-1">Баға</div>
                    <div id="final-grade" class="text-2xl font-bold text-emerald-600">-</div>
                </div>
            </div>

            <!-- Detailed Review Toggle -->
            <div class="text-left mb-6">
                <h3 class="text-lg font-semibold text-gray-800 mb-3">Қателермен жұмыс & Түсініктемелер:</h3>
                <div id="review-list" class="space-y-4 max-h-80 overflow-y-auto pr-2">
                    <!-- Review items injected here -->
                </div>
            </div>

            <button onclick="restartQuiz()" class="px-6 py-3 bg-indigo-600 text-white font-semibold rounded-xl hover:bg-indigo-700 transition shadow-lg">
                🔄 Қайта тапсыру
            </button>
        </div>

    </div>

    <script>
        // Question Data Array with TeX formulas and Kazakh explanations
        const questions = [
            {
                question: "Көрсеткіштік теңдеуді шешіңіз: $$2^{x+2} + 2^x = 20$$",
                options: ["x = 1", "x = 2", "x = 3", "x = 4"],
                correct: 1,
                explanation: "Ортақ көбейткішті жақша сыртына шығарамыз: $$2^x(2^2 + 1) = 20 \\implies 2^x \\cdot 5 = 20 \\implies 2^x = 4 \\implies x = 2$$"
            },
            {
                question: "Логарифмдік теңдеудің түбірлерін табыңыз: $$\\log_3(x^2 - 7) = 2$$",
                options: ["x = 4", "x = -4", "x = \\pm 4", "x = \\pm 3"],
                correct: 2,
                explanation: "Логарифм анықтамасы бойынша: $$x^2 - 7 = 3^2 \\implies x^2 - 7 = 9 \\implies x^2 = 16 \\implies x = \\pm 4$$"
            },
            {
                question: "$$f(x) = x^3 - 3x^2 + 5$$ функциясының туындысын табыңыз.",
                options: ["f'(x) = 3x^2 - 6x", "f'(x) = 3x^2 - 3", "f'(x) = x^2 - 6x", "f'(x) = 3x^2 - 6x + 5"],
                correct: 0,
                explanation: "Дәрежелік функцияның туынды алу ережесі бойынша: $$(x^n)' = n x^{n-1}$$. Тұрақты санның туындысы 0-ге тең. Сондықтан: $$f'(x) = 3x^2 - 6x$$"
            },
            {
                question: "Өрнекті ықшамдаңыз: $$\\frac{\\sin(2\\alpha)}{2\\cos\\alpha}$$",
                options: ["\\cos\\alpha", "\\sin\\alpha", "\\tan\\alpha", "2\\sin\\alpha"],
                correct: 1,
                explanation: "Косинус пен синустың екі еселенген бұрышының формуласын қолданамыз: $$\\sin(2\\alpha) = 2\\sin\\alpha\\cos\\alpha$$. <br>Өрнекке қойсақ: $$\\frac{2\\sin\\alpha\\cos\\alpha}{2\\cos\\alpha} = \\sin\\alpha$$"
            },
            {
                question: "Анықталмаған интегралды табыңыз: $$\\int (3x^2 + 2x) dx$$",
                options: ["x^3 + x^2 + C", "3x^3 + 2x^2 + C", "6x + 2 + C", "x^3 + 2x + C"],
                correct: 0,
                explanation: "Анықталмаған интеграл формуласы: $$\\int x^n dx = \\frac{x^{n+1}}{n+1} + C$$. <br>$$\\int (3x^2 + 2x) dx = 3\\cdot\\frac{x^3}{3} + 2\\cdot\\frac{x^2}{2} + C = x^3 + x^2 + C$$"
            },
            {
                question: "Логарифмдік теңдеуді шешіңіз: $$\\log_2 x + \\log_2 (x - 2) = 3$$",
                options: ["x = 4", "x = -2", "x = 4 \\text{ және } x = -2", "x = 8"],
                correct: 0,
                explanation: "Мүмкін мәндер жиыны (ММЖ): $$x > 2$$. <br>Логарифмдер қосындысының қасиеті бойынша: $$\\log_2(x(x-2)) = 3 \\implies x^2 - 2x = 2^3 = 8 \\implies x^2 - 2x - 8 = 0$$. Түбірлері: $$x = 4$$ және $$x = -2$$. ММЖ бойынша тек $$x = 4$$ жарамды."
            },
            {
                question: "$$y = e^{2x}$$ функциясының туындысын табыңыз.",
                options: ["y' = e^{2x}", "y' = 2e^{2x}", "y' = 2e^x", "y' = \\frac{1}{2}e^{2x}"],
                correct: 1,
                explanation: "Күрделі функцияның туындысын алу ережесі: $$(e^{k x})' = k \\cdot e^{k x}$$. Сондықтан: $$y' = 2e^{2x}$$"
            },
            {
                question: "Ойын сүйегін (6 қырлы) 1 рет лақтырғанда жұп сан түсуінің ықтималдығын табыңыз.",
                options: ["1/6", "1/3", "1/2", "2/3"],
                correct: 2,
                explanation: "Барлық мүмкін нәтижелер: {1, 2, 3, 4, 5, 6} (барлығы 6). <br>Жұп сандар: {2, 4, 6} (барлығы 3). <br>Ықтималдық: $$P = \\frac{3}{6} = \\frac{1}{2}$$"
            },
            {
                question: "Көрсеткіштік теңсіздікті шешіңіз: $$0{,}5^x > 0{,}25$$",
                options: ["x > 2", "x < 2", "x > 0{,}5", "x < 0{,}5"],
                correct: 1,
                explanation: "$$0{,}25 = 0{,}5^2$$ деп жазамыз: $$0{,}5^x > 0{,}5^2$$. <br>Негізі $$0 < 0{,}5 < 1$$ болғандықтан, дәреже көрсеткіштерін салыстырғанда теңсіздік белгісі қарама-қарсыға ауысады: $$x < 2$$"
            },
            {
                question: "Анықталған интегралды есептеңіз: $$\\int_{0}^{\\pi} \\sin x dx$$",
                options: ["0", "1", "2", "-1"],
                correct: 2,
                explanation: "Ньютон-Лейбниц формуласы: $$\\int_{a}^{b} f(x)dx = F(b) - F(a)$$. <br>$$\\int_{0}^{\\pi} \\sin x dx = [-\\cos x]_{0}^{\\pi} = -\\cos(\\pi) - (-\\cos(0)) = -(-1) - (-1) = 1 + 1 = 2$$"
            }
        ];

        // Quiz State Logic
        let currentQuestion = 0;
        let selectedOption = null;
        let userAnswers = new Array(questions.length).fill(null);
        let checkedState = new Array(questions.length).fill(false);

        function loadQuestion() {
            const q = questions[currentQuestion];
            document.getElementById('question-number').innerText = `Сұрақ ${currentQuestion + 1} / ${questions.length}`;
            document.getElementById('progress-bar').style.width = `${((currentQuestion + 1) / questions.length) * 100}%`;
            
            document.getElementById('question-title').innerHTML = q.question;

            const optionsContainer = document.getElementById('options-container');
            optionsContainer.innerHTML = '';

            q.options.forEach((opt, idx) => {
                const btn = document.createElement('button');
                btn.className = `option-btn w-full text-left p-4 rounded-xl border border-gray-200 text-gray-800 font-medium flex items-center justify-between hover:bg-indigo-50/50 hover:border-indigo-300 transition`;
                btn.innerHTML = `<span>${opt}</span> <div class="radio-indicator w-5 h-5 rounded-full border-2 border-gray-300 flex items-center justify-center"></div>`;
                
                btn.onclick = () => selectOption(idx);
                optionsContainer.appendChild(btn);
            });

            // Restore selection if answered
            selectedOption = userAnswers[currentQuestion];
            const checkBtn = document.getElementById('check-btn');
            const nextBtn = document.getElementById('next-btn');
            const prevBtn = document.getElementById('prev-btn');
            const explanationBox = document.getElementById('explanation-box');

            prevBtn.classList.toggle('hidden', currentQuestion === 0);

            if (checkedState[currentQuestion]) {
                highlightOptions();
                showExplanation();
                checkBtn.classList.add('hidden');
                nextBtn.classList.remove('hidden');
            } else {
                explanationBox.classList.add('hidden');
                checkBtn.classList.remove('hidden');
                nextBtn.classList.add('hidden');
                if (selectedOption !== null) {
                    updateOptionStyles();
                    checkBtn.disabled = false;
                } else {
                    checkBtn.disabled = true;
                }
            }

            // Render Math equations via KaTeX
            if (window.renderMathInElement) {
                renderMathInElement(document.getElementById('quiz-screen'), {
                    delimiters: [
                        {left: '$$', right: '$$', display: true},
                        {left: '$', right: '$', display: false}
                    ]
                });
            }
            
            notifyWixHeightChange();
        }

        function selectOption(index) {
            if (checkedState[currentQuestion]) return;
            selectedOption = index;
            userAnswers[currentQuestion] = index;
            document.getElementById('check-btn').disabled = false;
            updateOptionStyles();
        }

        function updateOptionStyles() {
            const buttons = document.querySelectorAll('#options-container button');
            buttons.forEach((btn, idx) => {
                const radio = btn.querySelector('.radio-indicator');
                if (idx === selectedOption) {
                    btn.className = 'option-btn w-full text-left p-4 rounded-xl border-2 border-indigo-600 bg-indigo-50 text-indigo-900 font-medium flex items-center justify-between shadow-sm';
                    radio.className = 'radio-indicator w-5 h-5 rounded-full border-2 border-indigo-600 bg-indigo-600 flex items-center justify-center';
                    radio.innerHTML = '<div class="w-2 h-2 bg-white rounded-full"></div>';
                } else {
                    btn.className = 'option-btn w-full text-left p-4 rounded-xl border border-gray-200 text-gray-800 font-medium flex items-center justify-between hover:bg-indigo-50/50 hover:border-indigo-300 transition';
                    radio.className = 'radio-indicator w-5 h-5 rounded-full border-2 border-gray-300 flex items-center justify-center';
                    radio.innerHTML = '';
                }
            });
        }

        function checkAnswer() {
            if (selectedOption === null) return;
            checkedState[currentQuestion] = true;
            highlightOptions();
            showExplanation();

            document.getElementById('check-btn').classList.add('hidden');
            document.getElementById('next-btn').classList.remove('hidden');
            
            notifyWixHeightChange();
        }

        function highlightOptions() {
            const buttons = document.querySelectorAll('#options-container button');
            const correct = questions[currentQuestion].correct;

            buttons.forEach((btn, idx) => {
                btn.disabled = true;
                btn.style.transform = 'none';
                if (idx === correct) {
                    btn.className = 'w-full text-left p-4 rounded-xl border-2 border-emerald-500 bg-emerald-50 text-emerald-900 font-medium flex items-center justify-between';
                } else if (idx === selectedOption && idx !== correct) {
                    btn.className = 'w-full text-left p-4 rounded-xl border-2 border-rose-500 bg-rose-50 text-rose-900 font-medium flex items-center justify-between';
                } else {
                    btn.className = 'w-full text-left p-4 rounded-xl border border-gray-200 text-gray-400 font-medium flex items-center justify-between opacity-60';
                }
            });
        }

        function showExplanation() {
            const q = questions[currentQuestion];
            const isCorrect = selectedOption === q.correct;
            const box = document.getElementById('explanation-box');
            const icon = document.getElementById('explanation-icon');
            const title = document.getElementById('explanation-title');
            const text = document.getElementById('explanation-text');

            box.classList.remove('hidden', 'bg-emerald-50', 'border-emerald-200', 'bg-rose-50', 'border-rose-200');

            if (isCorrect) {
                box.classList.add('bg-emerald-50', 'border-emerald-200');
                icon.innerText = '✅';
                icon.className = 'text-emerald-600';
                title.innerText = 'Өте жақсы! Жауабыңыз дұрыс.';
                title.className = 'font-bold text-emerald-800';
            } else {
                box.classList.add('bg-rose-50', 'border-rose-200');
                icon.innerText = '❌';
                icon.className = 'text-rose-600';
                title.innerText = 'Қате! Дұрыс жауабы көрсетілді.';
                title.className = 'font-bold text-rose-800';
            }

            text.innerHTML = q.explanation;
            
            if (window.renderMathInElement) {
                renderMathInElement(text, {
                    delimiters: [
                        {left: '$$', right: '$$', display: true},
                        {left: '$', right: '$', display: false}
                    ]
                });
            }
        }

        function nextQuestion() {
            if (currentQuestion < questions.length - 1) {
                currentQuestion++;
                loadQuestion();
            } else {
                showResults();
            }
        }

        function prevQuestion() {
            if (currentQuestion > 0) {
                currentQuestion--;
                loadQuestion();
            }
        }

        function showResults() {
            document.getElementById('quiz-screen').classList.add('hidden');
            document.getElementById('progress-container').classList.add('hidden');
            document.getElementById('result-screen').classList.remove('hidden');

            let score = 0;
            const reviewList = document.getElementById('review-list');
            reviewList.innerHTML = '';

            questions.forEach((q, idx) => {
                const isCorrect = userAnswers[idx] === q.correct;
                if (isCorrect) score++;

                const reviewItem = document.createElement('div');
                reviewItem.className = `p-4 rounded-xl border ${isCorrect ? 'bg-emerald-50/50 border-emerald-200' : 'bg-rose-50/50 border-rose-200'}`;
                reviewItem.innerHTML = `
                    <div class="flex items-start justify-between gap-2 mb-1">
                        <span class="font-semibold text-sm ${isCorrect ? 'text-emerald-800' : 'text-rose-800'}">
                            ${idx + 1}-сұрақ: ${isCorrect ? '✓ Дұрыс' : '✗ Қате'}
                        </span>
                    </div>
                    <div class="text-sm text-gray-800 mb-2">${q.question}</div>
                    <div class="text-xs text-gray-600"><strong>Шығарылу жолы:</strong> ${q.explanation}</div>
                `;
                reviewList.appendChild(reviewItem);
            });

            const percentage = Math.round((score / questions.length) * 100);
            document.getElementById('final-score').innerText = `${score} / ${questions.length}`;
            document.getElementById('final-percentage').innerText = `${percentage}%`;

            let grade = '2 (Қанағаттанарлықсыз)';
            let gradeColor = 'text-rose-600';
            if (percentage >= 85) {
                grade = '5 (Өте жақсы)';
                gradeColor = 'text-emerald-600';
            } else if (percentage >= 65) {
                grade = '4 (Жақсы)';
                gradeColor = 'text-indigo-600';
            } else if (percentage >= 50) {
                grade = '3 (Қанағаттанарлық)';
                gradeColor = 'text-amber-600';
            }

            const gradeEl = document.getElementById('final-grade');
            gradeEl.innerText = grade;
            gradeEl.className = `text-xl font-bold ${gradeColor}`;

            if (window.renderMathInElement) {
                renderMathInElement(reviewList, {
                    delimiters: [
                        {left: '$$', right: '$$', display: true},
                        {left: '$', right: '$', display: false}
                    ]
                });
            }

            notifyWixHeightChange();
        }

        function restartQuiz() {
            currentQuestion = 0;
            selectedOption = null;
            userAnswers.fill(null);
            checkedState.fill(false);

            document.getElementById('result-screen').classList.add('hidden');
            document.getElementById('quiz-screen').classList.remove('hidden');
            document.getElementById('progress-container').classList.remove('hidden');

            loadQuestion();
        }

        // Notify Wix frame of size changes if running inside an iframe
        function notifyWixHeightChange() {
            setTimeout(() => {
                const height = document.body.scrollHeight;
                window.parent.postMessage({ frameHeight: height }, '*');
            }, 100);
        }

        // Initialize Quiz on load
        window.onload = function() {
            loadQuestion();
        };
    </script>
</body>
</html>
